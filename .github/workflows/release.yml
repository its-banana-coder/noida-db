name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  check-version:
    name: Verify Cargo.toml version matches tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check version matches tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "ERROR: tag v${TAG_VERSION} does not match Cargo.toml version ${CARGO_VERSION}"
            exit 1
          fi
          echo "VERSION=${TAG_VERSION}" >> "$GITHUB_ENV"

  build:
    name: Build ${{ matrix.target }}
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set VERSION from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Install cross (aarch64 Linux only)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --all-features --target ${{ matrix.target }}
          else
            cargo build --release --all-features --target ${{ matrix.target }}
          fi

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf noida-db-${{ env.VERSION }}-${{ matrix.target }}.tar.gz noida-db

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a noida-db-${{ env.VERSION }}-${{ matrix.target }}.zip noida-db.exe

      - name: Checksum (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          sha256sum noida-db-${{ env.VERSION }}-${{ matrix.target }}.tar.gz \
            > noida-db-${{ env.VERSION }}-${{ matrix.target }}.sha256

      - name: Checksum (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          shasum -a 256 noida-db-${{ env.VERSION }}-${{ matrix.target }}.tar.gz \
            > noida-db-${{ env.VERSION }}-${{ matrix.target }}.sha256

      - name: Checksum (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          sha256sum noida-db-${{ env.VERSION }}-${{ matrix.target }}.zip \
            > noida-db-${{ env.VERSION }}-${{ matrix.target }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: noida-db-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/noida-db-${{ env.VERSION }}-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Combine checksums into SHA256SUMS
        run: |
          cat dist/*.sha256 > dist/SHA256SUMS
          echo "=== SHA256SUMS ==="
          cat dist/SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true

  publish-crate:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        run: cargo publish --all-features --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-npm:
    name: Publish npm packages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Set VERSION from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Each npm/platforms/<plat> package ships one platform's binary,
      # extracted directly from the same archives the `build` job already
      # produced (see npm/platforms/*/package.json's "files" field, and
      # npm/noida-db/bin/noida-db.js, which require.resolve()s this exact
      # path at runtime) -- not re-downloaded from the GitHub Release,
      # since the build artifacts are already sitting right here.
      - name: Populate and publish platform packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          declare -A TARGETS=(
            [linux-x64]=x86_64-unknown-linux-gnu
            [linux-arm64]=aarch64-unknown-linux-gnu
            [darwin-x64]=x86_64-apple-darwin
            [darwin-arm64]=aarch64-apple-darwin
            [win32-x64]=x86_64-pc-windows-msvc
          )
          for plat in "${!TARGETS[@]}"; do
            target="${TARGETS[$plat]}"
            dir="npm/platforms/$plat"
            if [ "$plat" = "win32-x64" ]; then
              unzip -o "dist/noida-db-${VERSION}-${target}.zip" -d "$dir"
            else
              tar xzf "dist/noida-db-${VERSION}-${target}.tar.gz" -C "$dir"
            fi
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('$dir/package.json'));
              p.version = '${VERSION}';
              fs.writeFileSync('$dir/package.json', JSON.stringify(p, null, 2) + '\n');
            "
            (cd "$dir" && npm publish --access public)
          done

      - name: Bump and publish the meta package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('npm/noida-db/package.json'));
            p.version = '${VERSION}';
            for (const k of Object.keys(p.optionalDependencies)) {
              p.optionalDependencies[k] = '${VERSION}';
            }
            fs.writeFileSync('npm/noida-db/package.json', JSON.stringify(p, null, 2) + '\n');
          "
          (cd npm/noida-db && npm publish --access public)
