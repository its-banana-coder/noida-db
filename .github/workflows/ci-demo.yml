# The same integration test suite (examples/ci-demo) against real service
# containers and against noida-db, to compare CI time. Each job runs 3 times.
name: ci-demo
on:
  workflow_dispatch:
  push:
    paths: ["examples/ci-demo/**", ".github/workflows/ci-demo.yml", "action.yml"]

jobs:
  service-containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        run: [1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 60
      mysql:
        image: mysql:8.0
        env: { MYSQL_ALLOW_EMPTY_PASSWORD: "yes", MYSQL_DATABASE: test }
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1" --health-interval 2s --health-timeout 5s --health-retries 60
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 60
      kafka:
        image: apache/kafka:3.8.0
        ports: ["9092:9092"]
        options: --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092" --health-interval 3s --health-timeout 10s --health-retries 60
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
        env: { discovery.type: single-node, xpack.security.enabled: "false", ES_JAVA_OPTS: "-Xms512m -Xmx512m" }
        ports: ["9200:9200"]
        options: --health-cmd "curl -fs localhost:9200/_cluster/health?wait_for_status=yellow" --health-interval 3s --health-timeout 10s --health-retries 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r examples/ci-demo/requirements.txt
      - run: pytest -q examples/ci-demo

  noida-db:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        run: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./  # this repo's action.yml; elsewhere: its-banana-coder/noida-db@main
        with: { version: "0.2.0" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r examples/ci-demo/requirements.txt
      - run: pytest -q examples/ci-demo
