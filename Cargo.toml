[package]
name = "noida"
version = "0.1.0"
edition = "2024"
description = "One tiny local binary that speaks Postgres, MySQL, Redis, Kafka, Elasticsearch and ClickHouse."
license = "MIT"

# One feature per service, so people can build only what they use.
[features]
default = ["redis"]
redis = []
postgres = ["dep:pgwire", "dep:sqlparser", "dep:bytes"]
kafka = []
memcached = []

[dependencies]
# Postgres: wire-protocol message codecs only (no tokio server API).
pgwire = { version = "0.41", default-features = false, optional = true }
bytes = { version = "1", optional = true }
# Postgres: SQL parsing.
sqlparser = { version = "0.63", default-features = false, features = ["std"], optional = true }

# The whole point of noida is a small footprint: tune release builds for size.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
redis = { version = "1.7.0", default-features = false }
postgres = { version = "0.19", features = ["with-serde_json-1", "with-uuid-1", "with-chrono-0_4"] }
serde_json = "1"
uuid = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# Service test suites only build when their service is compiled in.
[[test]]
name = "redis_client"
required-features = ["redis"]

[[test]]
name = "redis_diff"
required-features = ["redis"]

[[test]]
name = "redis_coverage"
required-features = ["redis"]

[[test]]
name = "longdouble_oracle"
required-features = ["redis"]

[[test]]
name = "postgres_client"
required-features = ["postgres"]

[[test]]
name = "postgres_diff"
required-features = ["postgres"]
