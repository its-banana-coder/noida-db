[package]
name = "noida-db"
version = "0.2.2"
edition = "2024"
description = "One tiny local binary that speaks Postgres, MySQL, Redis, Kafka, Elasticsearch and ClickHouse."
license = "MIT"
repository = "https://github.com/its-banana-coder/noida-db"
homepage = "https://github.com/its-banana-coder/noida-db"
readme = "README.md"
keywords = ["database", "postgres", "redis", "mysql", "devtools"]
categories = ["development-tools", "emulators"]
# Without this, `cargo publish` bundles the *entire* repo into the crate
# tarball by default -- docs/, npm/, pip/, scripts/, benchmarks/, this
# repo's own CI workflows, none of which a downstream `cargo install`
# needs. Keep this an explicit whitelist (not a growing `exclude` list)
# so a new top-level directory never ends up in the package by accident.
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

# Its own workspace root, so cargo never reads the manifest of an enclosing
# checkout (as when this repo is a worktree nested inside another).
[workspace]
# A client-test crate under tests/clients has its own dependencies (tokio,
# sqlx...) that don't belong in noida-db's own build.
exclude = ["tests/clients/postgres/rust"]

[lib]
name = "noida"

[[bin]]
name = "noida-db"
path = "src/main.rs"

# One feature per service, so people can build only what they use.
[features]
default = ["redis", "postgres"]
redis = ["dep:mlua"]
# Shared SQL engine pieces; enabled by every SQL service.
sql = ["dep:md-5", "dep:sha1", "dep:sha2", "dep:hmac"]
postgres = ["sql", "dep:pgwire", "dep:sqlparser", "dep:bytes", "dep:regex-lite", "dep:rust-stemmers"]
mysql = ["sql", "dep:sqlparser", "dep:bytes", "dep:regex-lite"]
kafka = ["dep:kafka-protocol", "dep:bytes", "dep:crc32c"]
elasticsearch = ["dep:regex-lite", "dep:flate2", "dep:rust-stemmers", "dep:unicode-segmentation"]
mongodb = []
# HTTP interface only; the codec is hand-rolled (see src/clickhouse/http.rs),
# same as the other services' wire protocols.
clickhouse = []

[dependencies]
# SQL hash functions: pgcrypto's digest()/hmac(), sha224..sha512, and
# MySQL's SHA1()/SHA2() (already in the tree via other dependencies).
md-5 = { version = "0.11", optional = true }
sha1 = { version = "0.11", optional = true }
sha2 = { version = "0.11", optional = true }
hmac = { version = "0.13", optional = true }
# Postgres: wire-protocol message codecs only (no tokio server API).
pgwire = { version = "0.41", default-features = false, optional = true }
bytes = { version = "1", optional = true }
# Postgres regex ops and Elasticsearch's `regexp` query (already a pgwire
# dependency).
regex-lite = { version = "0.1", optional = true }
# Postgres: SQL parsing.
sqlparser = { version = "0.63", default-features = false, features = ["std"], optional = true }
# Postgres: Snowball stemming for to_tsvector/to_tsquery's 'english' config.
rust-stemmers = { version = "1.2", optional = true }
# Elasticsearch: UAX#29 word boundaries for the `standard` tokenizer.
unicode-segmentation = { version = "1.13", optional = true }
# Redis: EVAL and friends run in Lua 5.1, the version Redis embeds. The
# vendored interpreter is compiled in (~250KB), which is the whole feature.
mlua = { version = "0.12", default-features = false, features = ["lua51", "vendored"], optional = true }
# Every service's on-disk persistence snapshot format (see
# src/persistence.rs and each service's own spawn_persistent), plus
# Elasticsearch's document storage -- unconditional (not feature-gated)
# since persistence applies across services regardless of which are built.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
# Kafka: wire protocol message encoding/decoding.
kafka-protocol = { version = "0.18.0", optional = true }
# Kafka: re-sealing a record batch after the broker edits its header.
crc32c = { version = "0.6", optional = true }
# Elasticsearch: gzip request/response bodies (clients' http_compress).
flate2 = { version = "1", optional = true }
bson = { version = "3.1.0", features = ["chrono-0_4", "uuid-1"] }
# Persistence: catching SIGINT/SIGTERM to save a snapshot before exit.
signal-hook = "0.3"

# The whole point of noida is a small footprint: tune release builds for size.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
redis = { version = "1.7.0", default-features = false, features = ["streams"] }
postgres = { version = "0.19", features = ["with-serde_json-1", "with-uuid-1", "with-chrono-0_4"] }
uuid = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# ClickHouse: a real HTTP client library against the HTTP interface, the
# same way clickhouse-connect/@clickhouse/client work.
ureq = { version = "3", default-features = false }
# ClickHouse: the official Rust client, now that RowBinaryWithNamesAndTypes
# (which it requires) is implemented. Async (hyper/tokio), dev-only.
clickhouse = "0.15"
mysql_async = "0.37.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
mongodb = "3.9.1"

# Service test suites only build when their service is compiled in.
[[test]]
name = "redis_client"
required-features = ["redis"]

[[test]]
name = "redis_diff"
required-features = ["redis"]

[[test]]
name = "redis_coverage"
required-features = ["redis"]

[[test]]
name = "redis_concurrency"
required-features = ["redis"]

[[test]]
name = "redis_persistence"
required-features = ["redis"]

[[test]]
name = "longdouble_oracle"
required-features = ["redis"]

[[test]]
name = "postgres_client"
required-features = ["postgres"]

[[test]]
name = "postgres_diff"
required-features = ["postgres"]

[[test]]
name = "ecommerce_diff"
required-features = ["postgres"]

[[test]]
name = "elasticsearch_diff"
required-features = ["elasticsearch"]

[[test]]
name = "kafka_client"
required-features = ["kafka"]

[[test]]
name = "kafka_diff"
required-features = ["kafka"]

[[test]]
name = "kafka_persistence"
required-features = ["kafka"]

[[test]]
name = "clickhouse_client"
required-features = ["clickhouse"]

[[test]]
name = "clickhouse_diff"
required-features = ["clickhouse"]

[[test]]
name = "clickhouse_official_client"
required-features = ["clickhouse"]

[[test]]
name = "mysql_client"
required-features = ["mysql"]

[[test]]
name = "mysql_diff"
required-features = ["mysql"]

[[test]]
name = "ecommerce_mysql_diff"
required-features = ["mysql"]

[[test]]
name = "mysql_persistence"
required-features = ["mysql"]

[[test]]
name = "mongodb_client"
required-features = ["mongodb"]

[[test]]
name = "mongodb_diff"
required-features = ["mongodb"]
