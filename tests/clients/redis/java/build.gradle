// Jedis, Lettuce, Spring Data Redis and Redisson against noida-db. Run
// through tests/clients/redis/run.sh, which starts the server, sets
// NOIDA_REDIS_PORT and picks a Gradle cache under target/ (nothing global).
plugins {
    id "application"
}
repositories { mavenCentral() }
dependencies {
    implementation "redis.clients:jedis:5.2.0"
    implementation "io.lettuce:lettuce-core:6.5.1.RELEASE"
    implementation "org.springframework.data:spring-data-redis:3.3.4"
    implementation "org.springframework:spring-tx:6.1.13"
    implementation "org.redisson:redisson:3.37.0"
    runtimeOnly "org.slf4j:slf4j-simple:2.0.16"
}
application {
    mainClass = System.getProperty("mainClass", "JedisTest")
}
